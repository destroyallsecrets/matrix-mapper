<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spatial Mapper</title>
    <meta name="description" content="A cyberpunk terminal simulation that visualizes spatial data using 3D wireframes and Matrix-style code streams, powered by Gemini for structural analysis." />
    <meta property="og:title" content="Spatial Mapper" />
    <meta property="og:description" content="A cyberpunk terminal simulation that visualizes spatial data using 3D wireframes and Matrix-style code streams, powered by Gemini for structural analysis." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        color: #0f0;
        font-family: 'Fira Code', monospace;
        overflow: hidden;
      }
      /* Custom Scrollbar for Terminal */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 20, 0, 0.6);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 100, 0, 0.5);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 180, 0, 0.8);
      }
      
      /* CRT Effect Overlay */
      .scanline {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0),
          rgba(255, 255, 255, 0) 50%,
          rgba(0, 0, 0, 0.22) 50%,
          rgba(0, 0, 0, 0.22)
        );
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 50;
      }
      .flicker {
        animation: flicker 0.15s infinite;
        pointer-events: none;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: rgba(18, 16, 16, 0.05);
        opacity: 0.08;
        z-index: 49;
      }
      @keyframes flicker {
        0% { opacity: 0.06; }
        50% { opacity: 0.09; }
        100% { opacity: 0.06; }
      }
      .glow-text {
        text-shadow: 0 0 5px #0f0, 0 0 10px #0f0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="scanline" id="crt-scanlines"></div>
    <div class="flicker" id="crt-flicker"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
